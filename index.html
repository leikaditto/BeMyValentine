<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Indie+Flower&display=swap" rel="stylesheet">
    
    <title>Valentine?</title>
    <link rel="shortcut icon" href="heart.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Music Button -->
    <button class="musicBtn" id="musicBtn">
       🔊
    </button>
    <audio id="bgMusic" src="Lover.mp3" loop></audio>

    <!-- Landing Page -->
    <div class="card" id="card">

        <h2>💖 Will you be my Valentine?</h2>
        <p>lets watch and eat together love.</p>

        <div class="buttons">
            <button class="yes" id="yesBtn">
                Yes 💘
            </button>
            <button class="no" id="noBtn">
                No 🥺
            </button>
        </div>

    </div>

    <!-- Envelope -->
    <div class="envelopeContainer" id="envelopeContainer">

        <div class="envelope" id="envelope">

            <div class="letter">
                <h3>Happy Valentine's Cate 💌</h3>
                <p>
                    I can't wait to see you again and sana forever na tayo magkasama sa susunod na magkita tayo.
                    I would love to be your forever Valentine, can't wait to spoil you everyday wifey.
                </p>
            </div>

        </div>

        <p class="tapTxt">
            Tap the envelope 💌
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
